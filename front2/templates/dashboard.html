<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Nexora</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        body {
            margin: 0;
            font-family: Inter, "Segoe UI", sans-serif;
            background: #05050a;
            color: white;
        }
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 40px 120px;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 60px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
        }
        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
        }
        .logout {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 14px;
        }
        .logout:hover { color: white; }

        .welcome {
            font-size: 46px;
            font-weight: 800;
            margin: 0 0 16px;
        }
        .welcome span { color: #a78bfa; }
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 17px;
            margin-bottom: 50px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .info-card {
            padding: 28px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
        }
        .info-card .label {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .info-card .value {
            font-size: 18px;
            font-weight: 600;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 16px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
        }
        .btn-secondary {
            padding: 16px 28px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">
            <div class="brand-icon">N</div>
            Nexora
        </div>
        <a class="logout" href="{{ url_for('logout') }}">Log out</a>
    </div>

    <h1 class="welcome">
        Welcome, <span>{{ username }}</span>
    </h1>
    <p class="subtitle">
        Your Nexora editor is open in a separate window.
        This page is your account dashboard.
    </p>

    <div class="info-grid">
        <div class="info-card">
            <div class="label">Username</div>
            <div class="value">{{ username }}</div>
        </div>
        <div class="info-card">
            <div class="label">Email</div>
            <div class="value">{{ email }}</div>
        </div>
        <div class="info-card">
            <div class="label">Status</div>
            <div class="value" style="color: #4ade80;">● Active</div>
        </div>
    </div>

    <div class="actions">
        <a class="btn-primary" href="{{ url_for('launch_editor') }}">
            Reopen editor →
        </a>
        <a class="btn-secondary" href="{{ url_for('index') }}">
            Back to home
        </a>
    </div>

</div>
</body>
</html>

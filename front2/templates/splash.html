<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #05050a;
            overflow: hidden;
        }

        #splash {
            position: fixed;
            inset: 0;
            background: #05050a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
            z-index: 9999;
        }

        #splash video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="splash">
    <video id="splashVideo"
           autoplay
           muted
           playsinline
           preload="auto">
        <source src="{{ url_for('static', filename='videos/int.mp4') }}"
                type="video/mp4">
    </video>
</div>

<script>
    // Redirect to the landing page as soon as int.mp4 finishes.
    // A hard timeout of 12 seconds ensures the user is never
    // stuck here even if autoplay is blocked or the video fails.
    const video   = document.getElementById('splashVideo');
    const splash  = document.getElementById('splash');
    const NEXT_URL = "{{ url_for('landing') }}";
    let advanced = false;

    function goToLanding() {
        if (advanced) return;
        advanced = true;

        splash.classList.add('fade-out');

        // Small delay so the fade finishes before navigation
        setTimeout(() => {
            window.location.href = NEXT_URL;
        }, 650);
    }

    video.addEventListener('ended', goToLanding);
    video.addEventListener('error', goToLanding);

    // Safety net — if the video never ends, redirect anyway
    setTimeout(goToLanding, 12000);
</script>

</body>
</html>
